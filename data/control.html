<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KlimaControl</title>
    <link rel="stylesheet" href="/common.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        .control-symbol {
            font-size: 20px;
            font-weight: bold;
            display: inline-block;
            min-width: 24px;
            text-align: center;
        }
        .control-symbol.inactive { color: #dc3545; }
        .control-symbol.active-off { color: #667eea; }
        .control-symbol.active-on { color: #28a745; }
        /* Amber: the device cannot vouch for the actuator's state. Deliberately
           not green — a confident symbol during a manifold outage is the panel
           lying about the one thing anyone looks at it for. */
        .control-symbol.uncertain { color: #d39e00; }

        /* Setpoint stepper. The value keeps a fixed width so the buttons do
           not shuffle sideways as it moves between 9.5 and 30.0. */
        .setpoint-stepper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .setpoint-stepper .control-value {
            min-width: 62px;
        }

        .step-btn {
            width: 34px;
            height: 34px;
            flex: none;
            border: none;
            border-radius: 50%;
            background-color: #667eea;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            line-height: 1;
            cursor: pointer;
            transition: background-color 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .step-btn:hover:not(:disabled) { background-color: #5568d3; }
        .step-btn:active:not(:disabled) { background-color: #4a5bc0; }

        /* At a rail there is nothing further to request, so the button says so
           rather than accepting a tap that would do nothing. */
        .step-btn:disabled {
            background-color: #c5c9e0;
            cursor: default;
        }

        .control-toggle-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        /* The 60x34 switch from common.css is sized for the settings page and
           overwhelms a control-bar cell. */
        .toggle-switch.toggle-sm { width: 44px; height: 24px; }
        .toggle-switch.toggle-sm .slider:before {
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
        }
        .toggle-switch.toggle-sm input:checked + .slider:before {
            transform: translateX(20px);
        }

        .param-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        .param-table td { padding: 6px 4px; border-bottom: 1px solid #eef0fb; }
        .param-table td:first-child { color: #6c757d; width: 45%; }
        .param-table td:last-child { text-align: right; font-weight: 600; color: #333; }
        .param-table .param-group td { color: #333; font-weight: 600; }

        /* A saturated controller sitting at 100% should be instantly
           distinguishable from one modulating at 40%; the number alone is
           easy to misread at a glance. */
        .demand-bar {
            display: inline-block;
            width: 90px;
            height: 8px;
            border-radius: 4px;
            background-color: #e4e7f5;
            margin-left: 8px;
            vertical-align: middle;
            overflow: hidden;
        }
        .demand-bar > span {
            display: block;
            height: 100%;
            background-color: #667eea;
            border-radius: 4px;
            transition: width 0.3s;
        }

        .autotune-box { margin-top: 14px; padding: 10px 12px; background-color: #f6f7fc; border-radius: 8px; }
        .autotune-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
        .autotune-state { font-size: 13px; font-weight: 600; color: #333; }
        .autotune-note { font-size: 12px; color: #6c757d; margin-top: 8px; line-height: 1.45; }
        .autotune-note strong { color: #856404; }
        .autotune-result { margin-top: 10px; font-size: 13px; }
        .autotune-result table { width: 100%; border-collapse: collapse; }
        .autotune-result td { padding: 4px; border-bottom: 1px solid #e4e7f5; }
        .autotune-result td:last-child { text-align: right; font-weight: 600; }

        .control-error {
            display: none;
            margin: -12px 0 16px;
            padding: 8px 12px;
            border-radius: 8px;
            background-color: #f8d7da;
            color: #721c24;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="pageTitle">klimacontrol</h1>
            <div class="device-id">
                <span id="deviceId">Loading...</span>
                <span id="firmwareVersion" class="firmware-version"></span>
                <span id="otaPartition" class="ota-partition"></span>
            </div>
        </div>

        <div class="content">
            <div class="sensor-grid">
                <div class="sensor-card">
                    <div class="sensor-label">Temperature</div>
                    <div class="sensor-value"><span class="sensor-number" id="currentTemp">-</span><span class="sensor-unit">&deg;C</span></div>
                </div>
                <div class="sensor-card">
                    <div class="sensor-label">Rel. Humidity</div>
                    <div class="sensor-value"><span class="sensor-number" id="currentHumidity">-</span><span class="sensor-unit">%</span></div>
                </div>
                <div class="sensor-card">
                    <div class="sensor-label">Dew Point</div>
                    <div class="sensor-value"><span class="sensor-number" id="currentDewPoint">-</span><span class="sensor-unit">&deg;C</span></div>
                </div>
            </div>

            <div class="control-bar">
                <div class="control-item">
                    <div class="control-label-sm">Target</div>
                    <div class="setpoint-stepper">
                        <button type="button" class="step-btn" id="setpointDown"
                                aria-label="Lower target temperature by 0.5 degrees" disabled>&minus;</button>
                        <div class="control-value" id="targetTemp">-</div>
                        <button type="button" class="step-btn" id="setpointUp"
                                aria-label="Raise target temperature by 0.5 degrees" disabled>+</button>
                    </div>
                </div>
                <div class="control-item">
                    <div class="control-label-sm">Control</div>
                    <div class="control-toggle-row">
                        <label class="toggle-switch toggle-sm">
                            <input type="checkbox" id="controlEnabled" aria-label="Enable temperature control">
                            <span class="slider"></span>
                        </label>
                        <span class="control-symbol" id="controlStatus">-</span>
                    </div>
                </div>
            </div>

            <div id="controlError" class="control-error" role="alert"></div>

            <div id="controlParams" class="measurement-section">
                <button class="btn btn-primary btn-sm" onclick="showControlParams()">Show Control Parameters</button>
                <button class="btn btn-danger btn-sm" id="clearParamsBtn" onclick="hideControlParams()" style="display: none; margin-left: 8px;">Hide</button>
                <table id="paramTable" class="param-table" style="display: none;">
                    <tbody id="paramTableBody"></tbody>
                </table>
                <div id="autotuneBox" class="autotune-box" style="display: none;">
                    <div class="autotune-row">
                        <span class="autotune-state" id="autotuneState">Autotune: idle</span>
                        <span>
                            <button class="btn btn-primary btn-sm" id="autotuneStartBtn" onclick="startAutotune()">Start autotune</button>
                            <button class="btn btn-danger btn-sm" id="autotuneAbortBtn" onclick="abortAutotune()" style="display:none;">Abort</button>
                        </span>
                    </div>
                    <div id="autotuneResult" class="autotune-result" style="display:none;"></div>
                    <div class="autotune-note" id="autotuneNote"></div>
                </div>
            </div>

            <div id="measurementOverview" class="measurement-section">
                <button class="btn btn-primary btn-sm" onclick="showMeasurements()">Show Measurements</button>
                <button class="btn btn-danger btn-sm" id="clearMeasurementsBtn" onclick="clearMeasurements()" style="display: none; margin-left: 8px;">Clear</button>
                <table id="measurementTable" class="measurement-table" style="display: none;">
                    <thead>
                        <tr>
                            <th>Measurement</th>
                            <th>Value</th>
                            <th>Unit</th>
                            <th>Sensor</th>
                        </tr>
                    </thead>
                    <tbody id="measurementTableBody">
                    </tbody>
                </table>
            </div>
        </div>

        <div class="nav-footer">
            <a href="/settings" class="about-link">Settings</a>
            <a href="/about" class="about-link">Device Info</a>
        </div>
    </div>

    <script>
        let currentStatus = {};
        let lastSuccessfulFetch = Date.now();
        let measurementsVisible = false;
        let controlParamsVisible = false;

        const SETPOINT_MIN = 10.0;
        const SETPOINT_MAX = 30.0;
        const SETPOINT_STEP = 0.5;
        const SETPOINT_DEBOUNCE_MS = 400;

        // Ownership of the two interactive fields. While the user is mid-gesture
        // the local value wins; once the request resolves, polling takes the
        // field back. Without this a poll landing between a tap and its response
        // would render the device's not-yet-updated value and the setpoint would
        // visibly jump backwards under the user's finger.
        let pendingSetpoint = null;   // non-null while an edit is uncommitted
        let setpointInFlight = false;
        let setpointTimer = null;
        let toggleInFlight = false;

        const CSRF_HEADERS = {
            'Content-Type': 'application/json',
            'X-Requested-With': 'KlimaControl'
        };

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        // Helper functions for control symbol.
        //
        // control_active is absent on firmware older than this feature. In that
        // case control_enabled is all we know, so an enabled device renders as
        // "enabled, output unknown" — hollow circle, active-off colour. Claiming
        // active-on there would paint a device that never reports output as if it
        // were actively heating.
        // control_state is richer than control_active: it can say "cannot
        // say", which a boolean cannot. Fall back to the boolean on firmware
        // that predates it.
        function getControlSymbol(enabled, active, state) {
            if (state === 'disabled') return '\u2212';
            if (state === 'heating') return '\u25CF';
            if (state === 'idle') return '\u25CB';
            if (state === 'unknown' || state === 'fault') return '\u2299';
            if (enabled === undefined) return '-';
            if (active === undefined) return enabled ? '\u25CB' : '\u2212';
            if (!enabled) return '\u2212';
            if (active) return '\u25CF';
            return '\u25CB';
        }

        function getControlSymbolClass(enabled, active, state) {
            if (state === 'disabled') return 'inactive';
            if (state === 'heating') return 'active-on';
            if (state === 'idle') return 'active-off';
            if (state === 'unknown') return 'uncertain';
            if (state === 'fault') return 'inactive';
            if (enabled === undefined) return 'inactive';
            if (active === undefined) return enabled ? 'active-off' : 'inactive';
            if (!enabled) return 'inactive';
            if (active) return 'active-on';
            return 'active-off';
        }

        // --- Setpoint stepper ---

        function showControlError(message) {
            const el = document.getElementById('controlError');
            if (!el) return;
            el.textContent = message;
            el.style.display = 'block';
        }

        function clearControlError() {
            const el = document.getElementById('controlError');
            if (!el) return;
            el.style.display = 'none';
            el.textContent = '';
        }

        // The device reports a float; snapping to the step keeps the stepper on
        // a predictable grid even if the stored value came from elsewhere.
        function snapToStep(value) {
            return Math.round(value / SETPOINT_STEP) * SETPOINT_STEP;
        }

        function renderSetpoint(value) {
            const el = document.getElementById('targetTemp');
            const down = document.getElementById('setpointDown');
            const up = document.getElementById('setpointUp');

            if (value === undefined || value === null || Number.isNaN(value)) {
                if (el) el.textContent = '-';
                if (down) down.disabled = true;
                if (up) up.disabled = true;
                return;
            }

            if (el) el.textContent = `${value.toFixed(1)}°C`;
            if (down) down.disabled = value <= SETPOINT_MIN;
            if (up) up.disabled = value >= SETPOINT_MAX;
        }

        // The value the UI currently considers authoritative: the user's
        // uncommitted edit if there is one, otherwise the device's.
        function effectiveSetpoint() {
            if (pendingSetpoint !== null) return pendingSetpoint;
            if (typeof currentStatus.target_temperature === 'number') {
                return snapToStep(currentStatus.target_temperature);
            }
            return null;
        }

        function adjustSetpoint(delta) {
            const base = effectiveSetpoint();
            if (base === null) return;

            const next = Math.min(SETPOINT_MAX, Math.max(SETPOINT_MIN, snapToStep(base + delta)));
            if (next === base) return;  // at a rail: nothing to send

            clearControlError();
            pendingSetpoint = next;
            renderSetpoint(next);

            // Coalesce a burst of taps into one request, so three taps write
            // NVS once rather than three times and the device is not asked to
            // chase intermediate values it will never hold.
            if (setpointTimer !== null) clearTimeout(setpointTimer);
            setpointTimer = setTimeout(commitSetpoint, SETPOINT_DEBOUNCE_MS);
        }

        async function commitSetpoint() {
            setpointTimer = null;
            if (pendingSetpoint === null) return;

            const value = pendingSetpoint;
            setpointInFlight = true;
            try {
                const response = await fetch('/api/temperature/target', {
                    method: 'POST',
                    headers: CSRF_HEADERS,
                    body: JSON.stringify({value: value})
                });

                if (!response.ok) {
                    // The device kept its old setpoint, so the screen must stop
                    // claiming otherwise.
                    showControlError('Target temperature rejected by device.');
                    pendingSetpoint = null;
                    renderSetpoint(effectiveSetpoint());
                    return;
                }

                // Only release the field if no further tap arrived while this
                // request was in flight; otherwise the later value is still
                // uncommitted and must keep ownership.
                if (pendingSetpoint === value) {
                    pendingSetpoint = null;
                    if (typeof currentStatus.target_temperature === 'number') {
                        currentStatus.target_temperature = value;
                    }
                }
            } catch (error) {
                console.error('Failed to set target temperature:', error);
                showControlError('Could not reach device. Target temperature unchanged.');
                pendingSetpoint = null;
                renderSetpoint(effectiveSetpoint());
            } finally {
                // Cleared on every path, including the early returns above, so
                // a failed request cannot leave polling permanently locked out.
                setpointInFlight = false;
            }
        }

        // --- Control enable toggle ---

        function renderControlToggle(enabled) {
            const el = document.getElementById('controlEnabled');
            if (!el) return;
            el.disabled = enabled === undefined;
            el.checked = enabled === true;
        }

        async function setControlEnabled(enabled) {
            clearControlError();
            toggleInFlight = true;
            try {
                const response = await fetch(enabled ? '/api/control/enable' : '/api/control/disable', {
                    method: 'POST',
                    headers: CSRF_HEADERS
                });

                if (!response.ok) {
                    showControlError('Device rejected the control change.');
                    renderControlToggle(currentStatus.control_enabled);
                    return;
                }

                currentStatus.control_enabled = enabled;
            } catch (error) {
                console.error('Failed to change control state:', error);
                showControlError('Could not reach device. Control state unchanged.');
                renderControlToggle(currentStatus.control_enabled);
            } finally {
                toggleInFlight = false;
            }
        }

        // Update device info display
        function updateDeviceInfo() {
            const pageTitleElement = document.getElementById('pageTitle');
            const deviceIdElement = document.getElementById('deviceId');

            if (currentStatus.device_id) {
                const hostname = "klima-" + currentStatus.device_id.toLowerCase();
                const hasCustomName = currentStatus.device_name && currentStatus.device_name !== currentStatus.device_id;

                // Update page title with custom name if set
                if (hasCustomName) {
                    pageTitleElement.textContent = 'KlimaControl ' + currentStatus.device_name;
                } else {
                    pageTitleElement.textContent = 'KlimaControl';
                }

                // Device ID and technical details
                let infoHTML = esc(currentStatus.device_id);

                if (currentStatus.wifi_connected && currentStatus.wifi_ssid) {
                    infoHTML += `<br><small class="device-subtitle">
                        WiFi: ${esc(currentStatus.wifi_ssid)}<br>
                        Access at: <a href="http://${hostname}.local/">${hostname}.local</a>
                    </small>`;
                } else {
                    infoHTML += `<br><small class="device-subtitle">
                        Access at: <a href="http://${hostname}.local/">${hostname}.local</a>
                    </small>`;
                }

                deviceIdElement.innerHTML = infoHTML;
            }

            // Update firmware version
            const firmwareVersionElement = document.getElementById('firmwareVersion');
            if (firmwareVersionElement && currentStatus.firmware_version) {
                firmwareVersionElement.textContent = currentStatus.firmware_version;
            }

            // Update OTA partition
            const otaPartitionElement = document.getElementById('otaPartition');
            if (otaPartitionElement && currentStatus.ota_partition) {
                otaPartitionElement.textContent = `(${currentStatus.ota_partition})`;
            }
        }

        // Initialize
        async function init() {
            document.getElementById('setpointDown')
                .addEventListener('click', () => adjustSetpoint(-SETPOINT_STEP));
            document.getElementById('setpointUp')
                .addEventListener('click', () => adjustSetpoint(SETPOINT_STEP));
            document.getElementById('controlEnabled')
                .addEventListener('change', (event) => setControlEnabled(event.target.checked));

            await updateStatus();
        }
        init();

        // Update status periodically
        setInterval(function() {
            updateStatus();
            if (measurementsVisible) refreshMeasurements();
            if (controlParamsVisible) { refreshControlParams(); refreshAutotune(); }
        }, 10000);

        // Fetch and update device status
        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                currentStatus = await response.json();
                
                // Update device info (device ID, firmware version, OTA partition)
                updateDeviceInfo();
                
                // Update temperature/humidity displays
                // Update temperature display
                const tempElement = document.getElementById('currentTemp');
                if (tempElement && currentStatus.temperature !== undefined) {
                    tempElement.textContent = currentStatus.temperature.toFixed(1);
                }

                // Update humidity display
                const humidityElement = document.getElementById('currentHumidity');
                if (humidityElement && currentStatus.relative_humidity !== undefined) {
                    humidityElement.textContent = currentStatus.relative_humidity.toFixed(1);
                }

                // Update dew point display from measurements array
                const dewPointElement = document.getElementById('currentDewPoint');
                if (dewPointElement && currentStatus.dew_point !== undefined) {
                    dewPointElement.textContent = currentStatus.dew_point.toFixed(1);
                }
                
                // Update target temperature display. Skipped only while the
                // user owns the field — every other field above and below still
                // refreshes, so a slow request never freezes the whole page.
                if (pendingSetpoint === null && !setpointInFlight) {
                    renderSetpoint(effectiveSetpoint());
                }

                // Update the enable toggle, subject to the same ownership rule
                if (!toggleInFlight) {
                    renderControlToggle(currentStatus.control_enabled);
                }

                // Update control status with symbol
                const controlStatusElement = document.getElementById('controlStatus');
                if (controlStatusElement) {
                    const symbol = getControlSymbol(currentStatus.control_enabled, currentStatus.control_active, currentStatus.control_state);
                    const symbolClass = getControlSymbolClass(currentStatus.control_enabled, currentStatus.control_active, currentStatus.control_state);
                    controlStatusElement.title = currentStatus.control_state || '';
                    controlStatusElement.textContent = symbol;
                    controlStatusElement.className = 'control-symbol ' + symbolClass;
                }

                // Mark data as fresh
                lastSuccessfulFetch = Date.now();
                document.querySelector('.sensor-grid').classList.remove('stale');
            } catch (error) {
                console.error('Failed to update status:', error);
                if (Date.now() - lastSuccessfulFetch > 30000) {
                    document.querySelector('.sensor-grid').classList.add('stale');
                }
            }
        }

        async function refreshMeasurements() {
            try {
                const response = await fetch('/api/measurements');
                const data = await response.json();
                const tbody = document.getElementById('measurementTableBody');
                const table = document.getElementById('measurementTable');
                const clearBtn = document.getElementById('clearMeasurementsBtn');
                if (!tbody || !table) return;
                if (!data.valid || !data.measurements || data.measurements.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="no-data">No data available</td></tr>';
                    table.style.display = 'table';
                    if (clearBtn) clearBtn.style.display = 'inline-block';
                    return;
                }
                tbody.innerHTML = data.measurements.map(m => {
                    const val = typeof m.value === 'number'
                        ? (Number.isInteger(m.value) ? m.value : m.value.toFixed(2))
                        : esc(String(m.value));
                    const calcNote = m.calculated ? ' <small class="calc-note">(calc)</small>' : '';
                    return `<tr>
                        <td>${esc(m.type)}${calcNote}</td>
                        <td>${val}</td>
                        <td>${esc(m.unit)}</td>
                        <td>${esc(m.sensor)}</td>
                    </tr>`;
                }).join('');
                table.style.display = 'table';
                if (clearBtn) clearBtn.style.display = 'inline-block';
            } catch (error) {
                console.error('Failed to fetch measurements:', error);
            }
        }

        async function showMeasurements() {
            measurementsVisible = true;
            await refreshMeasurements();
        }

        // Control parameters panel. Fetched on demand rather than on the poll,
        // so a client that never opens it costs the device nothing.
        function fmt(v, digits, unit) {
            if (typeof v !== 'number' || Number.isNaN(v)) return '&mdash;';
            return `${v.toFixed(digits)}${unit || ''}`;
        }

        async function refreshControlParams() {
            try {
                const response = await fetch('/api/control');
                const d = await response.json();
                const tbody = document.getElementById('paramTableBody');
                const table = document.getElementById('paramTable');
                if (!tbody || !table) return;

                // Demand as a percentage of the clamp range. This is the honest
                // reading of the controller's output: the three-state symbol in
                // the control bar only says "non-zero", so it looks the same at
                // 1% and at 100%.
                const lo = typeof d.output_min === 'number' ? d.output_min : 0;
                const hi = typeof d.output_max === 'number' ? d.output_max : 1;
                const span = (hi - lo) || 1;
                const pct = typeof d.output === 'number'
                    ? Math.max(0, Math.min(100, ((d.output - lo) / span) * 100))
                    : null;

                const STATE_TEXT = {
                    disabled: 'Disabled',
                    idle: 'Enabled \u2014 not heating',
                    heating: 'Heating (confirmed)',
                    unknown: 'Enabled \u2014 actuator not responding',
                    fault: 'Enabled \u2014 actuator fault'
                };
                const state = STATE_TEXT[d.state] ||
                    (d.enabled === false ? 'Disabled'
                                         : (d.running ? 'Enabled, running' : 'Enabled, not yet running'));

                const demandCell = pct === null ? '&mdash;'
                    : `${pct.toFixed(0)} %<span class="demand-bar"><span style="width:${pct.toFixed(0)}%"></span></span>`;

                tbody.innerHTML = `
                    <tr><td>State</td><td>${esc(state)}</td></tr>
                    <tr><td>Demand${(d.state === 'unknown' || d.state === 'fault') ? ' <small>(requested)</small>' : ''}</td><td>${demandCell}</td></tr>
                    <tr><td>Setpoint</td><td>${fmt(d.setpoint, 1, ' °C')}</td></tr>
                    <tr><td>Temperature</td><td>${fmt(d.temperature, 2, ' °C')}</td></tr>
                    <tr><td>Error</td><td>${fmt(d.error, 2, ' K')}</td></tr>
                    <tr><td>Integral term</td><td>${fmt(d.integral, 3)}</td></tr>
                    <tr class="param-group"><td colspan="2">Gains</td></tr>
                    <tr><td>Kp (proportional)</td><td>${fmt(d.kp, 3)}</td></tr>
                    <tr><td>Ki (integral)</td><td>${fmt(d.ki, 3)}</td></tr>
                    <tr><td>Kd (derivative)</td><td>${fmt(d.kd, 3)}</td></tr>`;
                table.style.display = 'table';
                const btn = document.getElementById('clearParamsBtn');
                if (btn) btn.style.display = 'inline-block';
            } catch (error) {
                console.error('Failed to fetch control parameters:', error);
            }
        }

        // --- Autotune ---

        const ABORT_TEXT = {
            none: '',
            user_requested: 'aborted at your request',
            ceiling_breached: 'aborted \u2014 temperature went above the run ceiling',
            floor_breached: 'aborted \u2014 temperature went below the run floor',
            sensor_lost: 'aborted \u2014 sensor data became unavailable',
            run_timeout: 'stopped \u2014 no limit cycle formed within the time budget',
            settling_timeout: 'stopped \u2014 the temperature never settled enough to start',
            amplitude_too_small: 'aborted \u2014 the oscillation never cleared the hysteresis band',
            derived_gains_invalid: 'aborted \u2014 the derived gains were not usable'
        };

        function renderAutotune(a) {
            const box = document.getElementById('autotuneBox');
            const stateEl = document.getElementById('autotuneState');
            const startBtn = document.getElementById('autotuneStartBtn');
            const abortBtn = document.getElementById('autotuneAbortBtn');
            const resultEl = document.getElementById('autotuneResult');
            const noteEl = document.getElementById('autotuneNote');
            if (!box) return;
            box.style.display = 'block';

            const secs = Math.round((a.elapsed_ms || 0) / 1000);
            const mins = Math.floor(secs / 60);
            const elapsed = mins > 0 ? `${mins} min ${secs % 60} s` : `${secs} s`;

            let label = `Autotune: ${esc(a.state || 'unknown')}`;
            if (a.active) label += ` \u2014 ${elapsed}, ${a.cycles || 0} cycle(s)`;
            if (a.state === 'aborted') {
                const reason = ABORT_TEXT[a.abort_reason] || esc(a.abort_reason || '');
                if (reason) label += ` \u2014 ${reason}`;
            }
            stateEl.textContent = label;

            startBtn.style.display = a.active ? 'none' : 'inline-block';
            abortBtn.style.display = a.active ? 'inline-block' : 'none';

            if (a.state === 'done') {
                resultEl.style.display = 'block';
                resultEl.innerHTML = `
                    <table>
                        <tr><td>Ku / Tu</td><td>${(a.ku || 0).toFixed(3)} / ${(a.tu || 0).toFixed(0)} s</td></tr>
                        <tr><td>Derived Kp</td><td>${(a.derived_kp || 0).toFixed(3)} <small>(now ${(a.kp || 0).toFixed(3)})</small></td></tr>
                        <tr><td>Derived Ki</td><td>${(a.derived_ki || 0).toFixed(4)} <small>(now ${(a.ki || 0).toFixed(4)})</small></td></tr>
                        <tr><td>Derived Kd</td><td>${(a.derived_kd || 0).toFixed(3)} <small>(now ${(a.kd || 0).toFixed(3)})</small></td></tr>
                    </table>
                    <button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="acceptAutotune()">Apply these gains</button>`;
            } else {
                resultEl.style.display = 'none';
                resultEl.innerHTML = '';
            }

            // The firmware decides whether a run can converge and supplies the
            // reason; the page only renders it. Hard-coding the reason here is
            // what let an obsolete warning survive the arrival of an actuator.
            const notes = [];
            if (a.can_converge === false) {
                const why = a.converge_note ||
                    'The output cannot drive the room, so a run will end in a timeout.';
                notes.push(`<strong>A run cannot converge yet.</strong> ${esc(why)} That is expected, not a fault.`);
            }
            if (a.gains_persisted === false) {
                notes.push('Applied gains are held in memory only and are lost on restart.');
            }
            noteEl.innerHTML = notes.join('<br>');
        }

        async function refreshAutotune() {
            try {
                const r = await fetch('/api/autotune/status');
                renderAutotune(await r.json());
            } catch (e) {
                console.error('Failed to fetch autotune status:', e);
            }
        }

        async function autotunePost(path, failMsg) {
            clearControlError();
            try {
                const r = await fetch(path, {method: 'POST', headers: CSRF_HEADERS});
                if (!r.ok) {
                    const body = await r.json().catch(() => ({}));
                    showControlError(body.error || failMsg);
                }
            } catch (e) {
                console.error(path, e);
                showControlError('Could not reach device.');
            }
            await refreshAutotune();
        }

        const startAutotune = () => autotunePost('/api/autotune/start', 'Could not start autotune.');
        const abortAutotune = () => autotunePost('/api/autotune/abort', 'Could not abort autotune.');
        const acceptAutotune = () => autotunePost('/api/autotune/accept', 'Could not apply gains.');

        async function showControlParams() {
            controlParamsVisible = true;
            await refreshControlParams();
            await refreshAutotune();
        }

        function hideControlParams() {
            controlParamsVisible = false;
            const box = document.getElementById('autotuneBox');
            if (box) box.style.display = 'none';
            const table = document.getElementById('paramTable');
            const tbody = document.getElementById('paramTableBody');
            const btn = document.getElementById('clearParamsBtn');
            if (table) table.style.display = 'none';
            if (tbody) tbody.innerHTML = '';
            if (btn) btn.style.display = 'none';
        }

        function clearMeasurements() {
            measurementsVisible = false;
            const table = document.getElementById('measurementTable');
            const tbody = document.getElementById('measurementTableBody');
            const clearBtn = document.getElementById('clearMeasurementsBtn');
            if (table) table.style.display = 'none';
            if (tbody) tbody.innerHTML = '';
            if (clearBtn) clearBtn.style.display = 'none';
        }
    </script>
</body>
</html>
